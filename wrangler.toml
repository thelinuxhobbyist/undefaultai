name = "undefault-ai-detector"
main = "./workers/detector/index.js"
compatibility_date = "2026-10-01"

routes = [
  { pattern = "undefaultai.com", custom_domain = true },
  { pattern = "www.undefaultai.com", custom_domain = true },
]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[r2_buckets]]
binding = "DEFAULT_DETECTOR"
bucket_name = "default-detector"

[observability]
    enabled = true
